<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="membuat form survey perokok" />
    <title>Survey Perokok</title>
  </head>
  <body>
    <form>
      <div>
        <div>
          <label for="nama">Siapa nama anda?</label>
        </div>
        <div>
          <input type="text" id="nama" name="nama" />
        </div>
      </div>
      <div>
        <div>
          <label for="umur">Berapa umur anda?</label>
        </div>
        <div>
          <input type="number" id="umur" name="umur" />
        </div>
      </div>
      <div>
        <label>Apa jenis kelamin anda?</label>
        <div>
          <input type="radio" id="laki-laki" name="jenis-kelamin" />
          <label for="laki-laki">Laki-laki</label>

          <input type="radio" id="perempuan" name="jenis-kelamin" />
          <label for="perempuan">Perempuan</label>
        </div>
      </div>
      <div>
        <label>Apakah anda perokok?</label>
        <div>
          <input type="radio" id="ya" name="anda-perokok" />
          <label for="ya">Ya</label>

          <input type="radio" id="tidak" name="anda-perokok" />
          <label for="tidak">Tidak</label>
        </div>
      </div>
    </form>
  </body>
</html>
